<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Secret Hellfest - Quête du Val de Loire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Metal+Mania&family=UnifrakturMaguntia&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .font-metal { font-family: 'Metal Mania', cursive; }
        .font-gothic { font-family: 'UnifrakturMaguntia', cursive; }
        .font-cinzel { font-family: 'Cinzel Decorative', serif; }

        .portal-card {
            background: rgba(18, 12, 14, 0.95);
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 0 40px rgba(255, 34, 0, 0.2);
        }

        .flame-text {
            background: linear-gradient(180deg, #ffffff 0%, #ffaa00 40%, #ff2200 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(255, 68, 0, 0.6);
        }

        /* Mirror flip effect for text */
        .mirror-text {
            display: inline-block;
            transform: scaleX(-1);
        }

        /* Pulse glow for active elements */
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
            50% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.8); }
        }
        .pulse-glow {
            animation: pulseGlow 2.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-stone-950 text-stone-100 min-h-screen font-sans flex flex-col items-center justify-center p-3 sm:p-6">

    <div id="tabQuest" class="w-full max-w-2xl flex flex-col items-center">
        
        <div class="portal-card w-full rounded-2xl p-6 sm:p-8 text-center relative overflow-hidden">
            
            <div class="absolute -top-12 -left-12 w-32 h-32 bg-red-600/20 rounded-full blur-2xl pointer-events-none"></div>
            <div class="absolute -bottom-12 -right-12 w-32 h-32 bg-amber-600/20 rounded-full blur-2xl pointer-events-none"></div>

            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-red-950/80 border border-red-500/40 text-red-400 text-xs font-bold uppercase tracking-widest mb-6">
                <i class="fa-solid fa-fire text-amber-500 animate-pulse"></i> ACCÈS RESTREINT • L'ÉPREUVE DU VAL DE LOIRE • PORTAIL SECRET HELLFEST
            </div>

            <div class="w-full bg-stone-900 h-3 rounded-full mb-8 border border-stone-800 overflow-hidden flex">
                <div id="questProgressBar" class="h-full bg-gradient-to-r from-red-600 to-amber-500 transition-all duration-500" style="width: 33%;"></div>
            </div>

            <div class="flex justify-between items-center max-w-xs mx-auto mb-8 text-xs font-bold">
                <div id="stepIndicator1" class="flex flex-col items-center text-amber-400">
                    <span class="w-8 h-8 rounded-full border-2 border-amber-500 flex items-center justify-center bg-amber-500/20 mb-1">1</span>
                    <span>Étape 1</span>
                </div>
                <div class="h-0.5 flex-1 bg-stone-800 mx-2"></div>
                <div id="stepIndicator2" class="flex flex-col items-center text-stone-500">
                    <span class="w-8 h-8 rounded-full border-2 border-stone-700 flex items-center justify-center bg-stone-900 mb-1">2</span>
                    <span>Étape 2</span>
                </div>
                <div class="h-0.5 flex-1 bg-stone-800 mx-2"></div>
                <div id="stepIndicator3" class="flex flex-col items-center text-stone-500">
                    <span class="w-8 h-8 rounded-full border-2 border-stone-700 flex items-center justify-center bg-stone-900 mb-1">3</span>
                    <span>Étape 3</span>
                </div>
            </div>

            <div id="questionBox" class="bg-stone-900/90 border border-stone-800 rounded-xl p-6 text-left shadow-inner relative">
                
                <div class="flex items-center justify-between mb-3 border-b border-stone-800 pb-2">
                    <span id="questionStepLabel" class="text-xs font-mono uppercase tracking-widest text-amber-400 font-bold">
                        Épreuve 1 / 3
                    </span>
                    <i class="fa-solid fa-circle-question text-stone-600"></i>
                </div>

                <h3 id="questionText" class="text-lg sm:text-xl font-bold text-stone-100 mb-5">
                    </h3>

                <div id="optionsContainer" class="space-y-3">
                    </div>

                <div id="feedbackBox" class="mt-4 p-3 rounded-lg text-xs font-bold hidden transition-all"></div>
            </div>

            <div id="victoryBox" class="hidden bg-stone-900/95 border-2 border-amber-500/80 rounded-2xl p-6 sm:p-8 text-center pulse-glow">
                
                <div class="w-16 h-16 bg-gradient-to-tr from-amber-500 to-red-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg shadow-amber-500/30">
                    <i class="fa-solid fa-map-location-dot text-stone-950 text-2xl"></i>
                </div>

                <span class="text-xs font-mono text-emerald-400 font-bold uppercase tracking-widest block mb-1">
                    <i class="fa-solid fa-circle-check mr-1"></i> ACCÈS AUTORISÉ • ÉNIGMES RÉSOLUES !
                </span>

                <h3 class="text-2xl sm:text-3xl font-metal flame-text mb-6 tracking-wider">
                    DESTINATION PRESQUE DÉVERROUILLÉE
                </h3>

                <div class="bg-stone-950/90 border border-amber-500/50 rounded-xl p-5 mb-6 text-left shadow-xl space-y-5">
                    
                    <div class="flex items-center gap-4 border-b border-stone-800 pb-4">
                        <div class="w-12 h-12 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-house-chimney-crack text-amber-400 text-2xl"></i>
                        </div>
                        <div>
                            <span class="text-[10px] uppercase font-mono text-amber-500 font-bold tracking-wider block mb-0.5">
                                Lieu Mystère
                            </span>
                            <h4 class="text-2xl font-bold font-mono text-amber-200 tracking-wider mirror-text select-none">
                                Casa Vill
                            </h4>
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <span id="gpsStatusBadge" class="text-[10px] font-mono px-2 py-0.5 rounded bg-red-950 text-red-400 border border-red-800 ml-auto">
                                <i class="fa-solid fa-lock mr-1"></i> VERROUILLÉ
                            </span>
                        </div>

                        <div class="bg-stone-900 border border-stone-800 rounded-xl p-4 space-y-4">
                            
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center font-mono">
                                <div class="gps-slot border-2 border-dashed border-stone-700 bg-stone-950/80 rounded-lg p-2.5 h-[54px] flex flex-col items-center justify-center transition-all cursor-pointer" data-target="0">
                                    <div class="slot-content text-amber-300 font-bold text-base"></div>
                                </div>
                                <div class="gps-slot border-2 border-dashed border-stone-700 bg-stone-950/80 rounded-lg p-2.5 h-[54px] flex flex-col items-center justify-center transition-all cursor-pointer" data-target="1">
                                    <div class="slot-content text-amber-300 font-bold text-base"></div>
                                </div>
                                <div class="gps-slot border-2 border-dashed border-stone-700 bg-stone-950/80 rounded-lg p-2.5 h-[54px] flex flex-col items-center justify-center transition-all cursor-pointer" data-target="2">
                                    <div class="slot-content text-amber-300 font-bold text-base"></div>
                                </div>
                                <div class="gps-slot border-2 border-dashed border-stone-700 bg-stone-950/80 rounded-lg p-2.5 h-[54px] flex flex-col items-center justify-center transition-all cursor-pointer" data-target="3">
                                    <div class="slot-content text-amber-300 font-bold text-base"></div>
                                </div>
                            </div>

                            <div id="gpsPiecesBank" class="flex flex-wrap items-center justify-center gap-2 pt-2 border-t border-stone-800">
                                </div>

                            <div id="gpsDecryptedBox" class="hidden bg-stone-950 border border-amber-500/40 rounded-lg p-3 flex items-center justify-between font-mono animate-pulse">
                                <div class="flex items-center gap-2">
                                    <i class="fa-solid fa-satellite-dish text-emerald-400 text-sm"></i>
                                    <span id="gpsTextDisplay" class="text-sm font-bold text-amber-300 tracking-wider">
                                        46.926029, -1.166057
                                    </span>
                                </div>
                                <span class="text-[10px] text-emerald-400 font-bold uppercase"><i class="fa-solid fa-check"></i> Signal Validé</span>
                            </div>

                        </div>
                    </div>

                </div>

                <div class="flex flex-col sm:flex-row gap-3">
                    <button id="btnCopyGps" onclick="copyGPS()" disabled class="flex-1 py-3 px-4 rounded-xl bg-stone-800 text-stone-500 font-bold text-sm transition opacity-50 cursor-not-allowed">
                        <i class="fa-solid fa-copy mr-2"></i> Copier
                    </button>
                    <button onclick="resetQuest()" class="py-3 px-4 rounded-xl bg-stone-800 hover:bg-stone-700 text-stone-300 font-bold text-xs">
                        <i class="fa-solid fa-rotate-left mr-1"></i> Recommencer
                    </button>
                </div>

            </div>

        </div>

    </div>

    <script>
        const GPS_LAT = 46.926029211564675;
        const GPS_LNG = -1.166056905586486;

        let isGpsDecrypted = false;
        let selectedPiece = null;
        let currentQuestionIndex = 0;

        // ==========================================
        // 3 QUESTIONS / RIDDLES CONFIGURATION
        // ==========================================
        const questData = [
            {
                stepLabel: "Étape 1 / 3 • L'Héritage Métal",
                question: "1. Quel était le nom de l'ancêtre direct du Hellfest, créé en 2002 par Ben Barbaud ?",
                options: [
                    { text: "A) Le Metal Fest", correct: false },
                    { text: "B) Le Fury Fest", correct: true },
                    { text: "C) Le Clisson Rock Show", correct: false },
                    { text: "D) Le Val de Loire Fest", correct: false }
                ],
                explanation: "Exact ! Le Fury Fest est né en 2002 avant de s'arrêter en 2005 et de renaître sous le nom de Hellfest en juin 2006 à Clisson."
            },
            {
                stepLabel: "Étape 2 / 3 • Le Tournant Géographique",
                question: "2. Pourquoi l'année 2012 a-t-elle été un tournant majeur pour le festival ?",
                options: [
                    { text: "A) Déménagement du site", correct: true },
                    { text: "B) Inondation majeure imposant le passage sous chapiteaux", correct: false },
                    { text: "C) Délocalisation temporaire de deux jours à Nantes", correct: false },
                    { text: "D) Passage à un format 100% acoustique", correct: false }
                ],
                explanation: "Parfait ! La construction du lycée A. Césaire a forcé le déménagement vers le Val de Moine, permettant un agrandissement massif avec 6 scènes."
            },
            {
                stepLabel: "Étape 3 / 3 • L'Annulation Historique",
                question: "3. Quel groupe phare a dû annuler sa venue lors de la toute première édition ?",
                options: [
                    { text: "A) Metallica", correct: false },
                    { text: "B) Megadeth", correct: false },
                    { text: "C) Korn", correct: true },
                    { text: "D) Slipknot", correct: false }
                ],
                explanation: "Bravo ! C'est Korn dont le chanteur Jonathan Davis avait été hospitalisé d'urgence juste avant le show. Tu as déverrouillé les coordonnées GPS !"
            }
        ];

        function renderQuestion() {
            const q = questData[currentQuestionIndex];
            if (!q) return;

            document.getElementById('questionStepLabel').innerText = q.stepLabel;
            document.getElementById('questionText').innerText = q.question;
            
            // Update progress bar
            const progressPercent = Math.round(((currentQuestionIndex + 1) / questData.length) * 100);
            const progressBar = document.getElementById('questProgressBar');
            if (progressBar) progressBar.style.width = `${progressPercent}%`;

            // Step indicators
            for (let i = 1; i <= 3; i++) {
                const ind = document.getElementById(`stepIndicator${i}`);
                if (ind) {
                    if (i <= currentQuestionIndex + 1) {
                        ind.className = "flex flex-col items-center text-amber-400";
                        ind.querySelector('span').className = "w-8 h-8 rounded-full border-2 border-amber-500 flex items-center justify-center bg-amber-500/20 mb-1";
                    } else {
                        ind.className = "flex flex-col items-center text-stone-500";
                        ind.querySelector('span').className = "w-8 h-8 rounded-full border-2 border-stone-700 flex items-center justify-center bg-stone-900 mb-1";
                    }
                }
            }

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3.5 rounded-xl bg-stone-950 border border-stone-800 hover:border-amber-500/60 hover:bg-stone-800/80 text-stone-200 text-sm font-semibold transition-all duration-200 flex items-center justify-between group";
                btn.innerHTML = `<span>${opt.text}</span> <i class="fa-solid fa-chevron-right text-stone-600 group-hover:text-amber-400 transition-colors"></i>`;
                btn.onclick = () => checkAnswer(idx);
                container.appendChild(btn);
            });

            const feedback = document.getElementById('feedbackBox');
            if (feedback) feedback.classList.add('hidden');
        }

        function checkAnswer(selectedIdx) {
            const q = questData[currentQuestionIndex];
            const isCorrect = q.options[selectedIdx].correct;
            const feedback = document.getElementById('feedbackBox');

            if (!feedback) return;

            feedback.classList.remove('hidden', 'bg-red-950/80', 'border-red-600', 'text-red-300', 'bg-emerald-950/80', 'border-emerald-600', 'text-emerald-300');

            if (isCorrect) {
                feedback.classList.add('bg-emerald-950/80', 'border', 'border-emerald-600', 'text-emerald-300');
                feedback.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 mr-2"></i><strong>Bonne réponse !</strong> ${q.explanation}`;

                // Disable options during delay
                const btns = document.querySelectorAll('#optionsContainer button');
                btns.forEach(b => b.disabled = true);

                setTimeout(() => {
                    currentQuestionIndex++;
                    if (currentQuestionIndex < questData.length) {
                        renderQuestion();
                    } else {
                        showVictory();
                    }
                }, 1800);
            } else {
                feedback.classList.add('bg-red-950/80', 'border', 'border-red-600', 'text-red-300');
                feedback.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-400 mr-2"></i><strong>Mauvaise réponse.</strong> Recommence pour trouver la bonne réponse !`;
            }
        }

        function showVictory() {
            const qBox = document.getElementById('questionBox');
            const vBox = document.getElementById('victoryBox');
            const progressBar = document.getElementById('questProgressBar');

            if (qBox) qBox.classList.add('hidden');
            if (vBox) vBox.classList.remove('hidden');
            if (progressBar) progressBar.style.width = '100%';
            
            isGpsDecrypted = false;
            initGpsPuzzle();

            const gpsBadge = document.getElementById('gpsStatusBadge');
            if (gpsBadge) {
                gpsBadge.className = "text-[10px] font-mono px-2 py-0.5 rounded bg-red-950 text-red-400 border border-red-800 ml-auto";
                gpsBadge.innerHTML = `<i class="fa-solid fa-lock mr-1"></i> VERROUILLÉ`;
            }

            const copyBtn = document.getElementById('btnCopyGps');
            if (copyBtn) {
                copyBtn.disabled = true;
                copyBtn.classList.add('opacity-50', 'cursor-not-allowed', 'text-stone-500');
                copyBtn.classList.remove('text-stone-200', 'bg-gradient-to-r', 'from-red-600', 'to-amber-600', 'hover:from-red-500', 'hover:to-amber-500');
            }

            const resultBox = document.getElementById('gpsDecryptedBox');
            if (resultBox) resultBox.classList.add('hidden');
        }

        // ==========================================
        // GPS DRAG & DROP PUZZLE ENGINE
        // ==========================================
        const puzzlePieces = [
            { id: "p1", val: "46.", slotTarget: 0 },
            { id: "p2", val: "9260", slotTarget: 1 },
            { id: "p3", val: "-1.", slotTarget: 2 },
            { id: "p4", val: "1660", slotTarget: 3 }
        ];

        let currentSlotState = [null, null, null, null];

        function initGpsPuzzle() {
            currentSlotState = [null, null, null, null];
            selectedPiece = null;

            // Clear Slots
            const slots = document.querySelectorAll('.gps-slot');
            slots.forEach(s => {
                s.classList.remove('border-amber-500', 'bg-amber-500/10', 'border-emerald-500', 'border-red-500', 'bg-red-950/30', 'bg-emerald-950/40');
                s.classList.add('border-stone-700', 'bg-stone-950/80');
                const content = s.querySelector('.slot-content');
                if (content) content.innerText = '';
                
                s.onclick = () => handleSlotClick(parseInt(s.dataset.target));
                s.ondragover = (e) => e.preventDefault();
                s.ondrop = (e) => {
                    e.preventDefault();
                    const pieceId = e.dataTransfer.getData("text/plain");
                    const pObj = puzzlePieces.find(p => p.id === pieceId);
                    if (pObj) placePieceInSlot(pObj, parseInt(s.dataset.target));
                };
            });

            // Shuffle pieces in bank
            const bank = document.getElementById('gpsPiecesBank');
            if (!bank) return;
            bank.innerHTML = '';

            const shuffled = [...puzzlePieces].sort(() => Math.random() - 0.5);
            shuffled.forEach(p => {
                const btn = document.createElement('div');
                btn.id = `piece-${p.id}`;
                btn.draggable = true;
                btn.className = "cursor-grab active:cursor-grabbing px-3.5 py-2 bg-stone-800 hover:bg-amber-900/40 border border-amber-500/40 rounded-lg text-amber-300 font-mono font-bold text-base shadow transition-all transform hover:scale-105 select-none";
                btn.innerText = p.val;

                btn.onclick = () => selectPiece(p, btn);

                btn.ondragstart = (e) => {
                    e.dataTransfer.setData("text/plain", p.id);
                    selectPiece(p, btn);
                };

                bank.appendChild(btn);
            });
        }

        function selectPiece(pObj, el) {
            document.querySelectorAll('#gpsPiecesBank div').forEach(d => d.classList.remove('ring-2', 'ring-amber-400', 'bg-amber-600/30'));
            selectedPiece = pObj;
            if (el) el.classList.add('ring-2', 'ring-amber-400', 'bg-amber-600/30');
        }

        function handleSlotClick(slotIdx) {
            if (selectedPiece) {
                placePieceInSlot(selectedPiece, slotIdx);
            }
        }

        function placePieceInSlot(pObj, slotIdx) {
            const existingIdx = currentSlotState.findIndex(s => s && s.id === pObj.id);
            if (existingIdx !== -1) {
                currentSlotState[existingIdx] = null;
                const prevSlot = document.querySelector(`.gps-slot[data-target="${existingIdx}"] .slot-content`);
                if (prevSlot) prevSlot.innerText = '';
            }

            currentSlotState[slotIdx] = pObj;

            const slotElem = document.querySelector(`.gps-slot[data-target="${slotIdx}"]`);
            if (slotElem) {
                const content = slotElem.querySelector('.slot-content');
                if (content) content.innerText = pObj.val;
            }

            const pElem = document.getElementById(`piece-${pObj.id}`);
            if (pElem) pElem.classList.add('hidden');

            selectedPiece = null;
            checkGpsPuzzleCompletion();
        }

        function checkGpsPuzzleCompletion() {
            const isFull = currentSlotState.every(s => s !== null);
            if (!isFull) return;

            const isCorrect = currentSlotState.every((s, idx) => s.slotTarget === idx);

            if (isCorrect) {
                isGpsDecrypted = true;
                const gpsBadge = document.getElementById('gpsStatusBadge');
                if (gpsBadge) {
                    gpsBadge.className = "text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800 ml-auto";
                    gpsBadge.innerHTML = `<i class="fa-solid fa-unlock mr-1"></i> DÉCRYPTÉ`;
                }

                document.querySelectorAll('.gps-slot').forEach(s => {
                    s.classList.remove('border-stone-700');
                    s.classList.add('border-emerald-500', 'bg-emerald-950/40');
                });

                const resultBox = document.getElementById('gpsDecryptedBox');
                if (resultBox) resultBox.classList.remove('hidden');

                const copyBtn = document.getElementById('btnCopyGps');
                if (copyBtn) {
                    copyBtn.disabled = false;
                    copyBtn.classList.remove('opacity-50', 'cursor-not-allowed', 'text-stone-500');
                    copyBtn.classList.add('text-stone-950', 'bg-gradient-to-r', 'from-red-600', 'to-amber-600', 'hover:from-red-500', 'hover:to-amber-500');
                }
            } else {
                document.querySelectorAll('.gps-slot').forEach(s => {
                    s.classList.add('border-red-500', 'bg-red-950/30');
                });

                setTimeout(() => {
                    initGpsPuzzle();
                }, 900);
            }
        }

        function resetQuest() {
            currentQuestionIndex = 0;
            const vBox = document.getElementById('victoryBox');
            const qBox = document.getElementById('questionBox');
            if (vBox) vBox.classList.add('hidden');
            if (qBox) qBox.classList.remove('hidden');
            renderQuestion();
        }

        function copyGPS() {
            if (!isGpsDecrypted) return;

            const textToCopy = `${GPS_LAT}, ${GPS_LNG}`;
            
            try {
                const tempInput = document.createElement("input");
                tempInput.value = textToCopy;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);

                const copyBtn = document.getElementById('btnCopyGps');
                if (copyBtn) {
                    copyBtn.innerHTML = `<i class="fa-solid fa-check text-emerald-950 mr-2"></i> Copié !`;
                    setTimeout(() => {
                        copyBtn.innerHTML = `<i class="fa-solid fa-copy mr-2"></i> Copier`;
                    }, 2000);
                }
            } catch(e) {}
        }

        window.onload = function() {
            renderQuestion();
        };
    </script>
</body>
</html>
